<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

    <title>House Price Predictor</title>
</head>

<body class="bg-dark">

    <div class="container">

        <div class="row">

            <div class="card"
                style="width:100%; height:100%; margin-top:50px; padding:20px;">

                <div class="card-header text-center">
                    <h1>House Price Predictor</h1>
                </div>

                <div class="card-body">

                    <form method="post" accept-charset="utf-8">

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label><b>Select Location</b></label>

                                <select class="form-control"
                                    id="location"
                                    name="location"
                                    required>

                                    {% for location in locations %}

                                    <option value="{{location}}">
                                        {{location}}
                                    </option>

                                    {% endfor %}

                                </select>
                            </div>

                            <div class="col-md-6 mb-3">

                                <label><b>Enter BHK</b></label>

                                <input type="number"
                                    class="form-control"
                                    id="bhk"
                                    name="bhk"
                                    required
                                    placeholder="Enter BHK">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label><b>Enter Bathrooms</b></label>

                                <input type="number"
                                    class="form-control"
                                    id="bath"
                                    name="bath"
                                    required
                                    placeholder="Enter Bathrooms">

                            </div>

                            <div class="col-md-6 mb-3">

                                <label><b>Enter Square Feet</b></label>

                                <input type="number"
                                    class="form-control"
                                    id="sqft"
                                    name="sqft"
                                    required
                                    placeholder="Enter Square Feet">

                            </div>

                            <div class="col-md-12 text-center">

                                <button class="btn btn-primary"
                                    onclick="send_data()">

                                    Predict Price

                                </button>

                            </div>

                        </div>

                    </form>

                    <br>

                    <div class="col-md-12 text-center">

                        <h3>
                            <span id="prediction"></span>
                        </h3>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script>

        function form_handler(event)
        {
            event.preventDefault();
        }

        function send_data()
        {
            event.preventDefault();

            document.querySelector('form')
                .addEventListener("submit", form_handler);

            var fd = new FormData(document.querySelector('form'));

            var xhr = new XMLHttpRequest();

            xhr.open('POST', '/predict', true);

            document.getElementById("prediction").innerHTML =
                "Wait Predicting Price!...";

            xhr.onreadystatechange = function()
            {
                if(xhr.readyState == XMLHttpRequest.DONE)
                {
                    document.getElementById('prediction').innerHTML =
                        "Estimated Price: ₹ " + (xhr.responseText/100).toFixed(2) + " Crore";
                }
            }

            xhr.onload = function(){};

            xhr.send(fd);
        }

    </script>

</body>

</html>
